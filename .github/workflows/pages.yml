name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara el sitio (sin metadatos de git/jj)
        run: rm -rf .git .jj

      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Sube el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Despliega
        id: deployment
        uses: actions/deploy-pages@v4
